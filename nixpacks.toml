[phases.setup]
nixPkgs = ["jdk17"]

[phases.install]
cmds = [
    "cd Portafolio-Astro && npm ci --legacy-peer-deps",
    "cd Terminal-KMP && chmod +x gradlew"
]

[phases.build]
cmds = [
    "cd Terminal-KMP && ./gradlew :webApp:copyWasmToAstro",
    "cd Portafolio-Astro && npm run build"
]

[start]
cmd = "cd Portafolio-Astro && node server.js"
