[phases.setup]
nixPkgs = ["nodejs_22", "jdk17"]
nixpkgsArchive = "51ad838b03a05b1de6f9f2a0fffecee64a9788ee"
aptPkgs = ["libatomic1"]

[phases.install]
cmds = [
    "cd Portafolio-Astro && npm ci --legacy-peer-deps"
]

[phases.build]
cmds = [
    "cd Terminal-KMP && chmod +x gradlew && ./gradlew :shared:compileTestKotlinWasmJs",
    "cd Terminal-KMP && ./gradlew :webApp:copyWasmToAstro",
    "cd Portafolio-Astro && npm run build"
]

[start]
cmd = "cd Portafolio-Astro && node server.js"
