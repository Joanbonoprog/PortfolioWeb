name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: 'npm'
          cache-dependency-path: Portafolio-Astro/package-lock.json

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('Terminal-KMP/**/*.gradle.kts', 'Terminal-KMP/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Compile KMP unit tests
        working-directory: Terminal-KMP
        run: chmod +x gradlew && ./gradlew :shared:compileTestKotlinWasmJs --no-configuration-cache

      - name: Build WASM and copy to Astro
        working-directory: Terminal-KMP
        run: ./gradlew :webApp:copyWasmToAstro --no-configuration-cache

      - name: Install Astro dependencies
        working-directory: Portafolio-Astro
        run: npm ci --legacy-peer-deps

      - name: Install Playwright Chromium
        working-directory: Portafolio-Astro
        run: npx playwright install --with-deps chromium

      - name: Build Astro
        working-directory: Portafolio-Astro
        run: npm run build

      - name: Run E2E tests
        working-directory: Portafolio-Astro
        run: npm run test:e2e:ci
